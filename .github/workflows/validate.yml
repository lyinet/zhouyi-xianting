name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 单元测试
        run: python3 scripts/selftest.py

      - name: skill 数据验收（64 卦 + 8 境 + 幕表 + 短语库 + 上下卦分解五条验证）
        run: python3 scripts/validate.py
